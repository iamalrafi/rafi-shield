org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
# Where the app downloads the verified blocklist from (folder URL, no trailing slash).
# GitHub Actions overrides this automatically with your own repository.
blocklistBase=https://raw.githubusercontent.com/YOUR_GITHUB_NAME/YOUR_REPO_NAME/main/blocklist
# Optional: URL of your Cloudflare Worker for reports (see worker/README). Empty = reporting disabled.
reportEndpoint=
