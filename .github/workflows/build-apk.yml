name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'blocklist/**'
      - 'worker/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Put the newest verified lists inside the APK as the starting list.
      - name: Refresh built-in lists
        run: |
          cp blocklist/blocklist.txt app/src/main/assets/blocklist_seed.txt
          cp blocklist/betting_apps.txt app/src/main/assets/betting_apps_seed.txt

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shield.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/shield.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using the stable signing key."
          else
            echo "No signing key secret found: using the automatic debug key."
          fi

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build APK
        run: >
          gradle --no-daemon :app:assembleRelease
          -PblocklistBase=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/blocklist
          -PreportEndpoint=${{ vars.REPORT_ENDPOINT }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BettingShieldBD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BettingShieldBD-apk
          path: BettingShieldBD.apk

      # A public download page that works from a phone browser without a GitHub login.
      - name: Publish download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK (build ${{ github.run_number }})
          body: |
            Download **BettingShieldBD.apk** below and open it on your Android phone.
            Build ${{ github.run_number }}, commit ${{ github.sha }}.
          files: BettingShieldBD.apk
          prerelease: true
